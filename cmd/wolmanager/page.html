<!doctype html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOL Manager</title>
  <script src="index.cgi?asset=i18n&rev=ko-lang"></script>
  <style>
    :root {
      --bg: #f4f8ff;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #6b7280;
      --line: #d9e4f5;
      --accent: #1976d2;
      --accent-dark: #1550a0;
      --accent-soft: #e3f2fd;
      --danger: #b42318;
      --ok: #15803d;
      --shadow: 0 10px 30px rgba(31, 41, 55, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html.i18n-pending .shell { visibility: hidden; }
    .shell { max-width: 1060px; margin: 0 auto; padding: 28px; }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      box-shadow: 0 6px 14px rgba(25, 118, 210, .25);
    }
    .sub { color: var(--muted); margin-top: 4px; }
    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      height: 36px;
      padding: 0 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.primary:hover { background: var(--accent-dark); }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .segmented {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--accent-soft);
    }
    .segmented button {
      border: 0;
      border-radius: 0;
      height: 32px;
      min-width: 82px;
      background: transparent;
      color: var(--muted);
    }
    .segmented button.active { background: var(--panel); color: var(--accent-dark); box-shadow: inset 0 0 0 1px rgba(25, 118, 210, .22); }
    .status { color: var(--muted); font-size: 13px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .list { display: grid; gap: 10px; padding: 14px; }
    .empty { padding: 48px 18px; color: var(--muted); text-align: center; }
    .device {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
    }
    .name { font-weight: 700; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; align-items: center; }
    form { padding: 16px; display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: #7b8797; font-size: 12px; font-weight: 650; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 36px;
      padding: 8px 10px;
      font: inherit;
      color: var(--text);
      background: white;
    }
    input::placeholder, textarea::placeholder {
      color: #8f9bad;
      opacity: .72;
      font-weight: 550;
    }
    .mac-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 6px;
      align-items: center;
    }
    .mac-sep {
      color: #a8b6c9;
      font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
    }
    .mac-grid input {
      text-align: center;
      text-transform: uppercase;
      font: 700 13px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 8px 4px;
      letter-spacing: 0;
    }
    .mac-grid input::placeholder {
      color: #8f9bad;
      opacity: .72;
      font-weight: 550;
    }
    .mac-grid input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(25, 118, 210, .14);
      outline: none;
    }
    textarea { min-height: 74px; resize: vertical; }
    .json-area {
      display: none;
      padding: 14px;
    }
    .json-area.active { display: grid; gap: 12px; }
    .json-editor {
      min-height: 430px;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
      overflow: auto;
      resize: vertical;
    }
    .form-row { display: grid; grid-template-columns: 1fr 88px; gap: 10px; }
    .form-actions { display: flex; gap: 8px; }
    .hidden-file { display: none; }
    .mode-view[hidden] { display: none; }
    @media (max-width: 820px) {
      .shell { padding: 18px; }
      header { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .device { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; flex-wrap: wrap; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="brand">
          <img class="brand-icon" src="images/icon_256.png" alt="">
          <div>
            <h1>WOL Manager</h1>
            <div class="sub" data-i18n="app.subtitle">DSM 原生局域网唤醒工具</div>
          </div>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="primary" id="newDevice" data-i18n="button.addDevice">添加设备</button>
      </div>
    </header>

    <section class="layout">
      <div class="panel">
        <div class="toolbar">
          <div class="toolbar-left">
            <strong data-i18n="devices.title">设备列表</strong>
            <div class="segmented" data-i18n-aria-label="mode.aria" aria-label="管理模式">
              <button id="uiMode" class="active" type="button" data-i18n="mode.ui">界面模式</button>
              <button id="jsonMode" type="button" data-i18n="mode.json">JSON 模式</button>
            </div>
          </div>
          <div class="toolbar-right">
            <button id="importJson" type="button" data-i18n="button.import">导入</button>
            <button id="exportJson" type="button" data-i18n="button.export">导出</button>
            <span class="status" id="status" data-i18n="status.loading">正在加载</span>
          </div>
        </div>
        <div class="mode-view" id="uiView">
          <div class="list" id="devices"></div>
        </div>
        <div class="json-area mode-view" id="jsonView" hidden>
          <textarea id="jsonEditor" class="json-editor" spellcheck="false"></textarea>
          <div class="form-actions">
            <button class="primary" id="saveJson" type="button" data-i18n="button.saveJson">保存 JSON</button>
            <button id="formatJson" type="button" data-i18n="button.format">格式化</button>
            <button id="reloadJson" type="button" data-i18n="button.reload">重新载入</button>
          </div>
        </div>
        <input class="hidden-file" id="jsonFile" type="file" accept="application/json,.json">
      </div>

      <aside class="panel">
        <div class="toolbar"><strong id="formTitle" data-i18n="form.addTitle">添加设备</strong></div>
        <form id="deviceForm">
          <input type="hidden" id="id">
          <label><span data-i18n="form.name">名称</span>
            <input id="name" autocomplete="off" required data-i18n-placeholder="placeholder.name" placeholder="客厅电脑">
          </label>
          <label><span data-i18n="form.mac">MAC 地址</span>
            <div class="mac-grid" id="macGrid">
              <input class="mac-part" inputmode="text" autocomplete="off" maxlength="2" placeholder="AA" data-mac-aria-index="1" aria-label="MAC 第 1 段">
              <span class="mac-sep">:</span>
              <input class="mac-part" inputmode="text" autocomplete="off" maxlength="2" placeholder="BB" data-mac-aria-index="2" aria-label="MAC 第 2 段">
              <span class="mac-sep">:</span>
              <input class="mac-part" inputmode="text" autocomplete="off" maxlength="2" placeholder="CC" data-mac-aria-index="3" aria-label="MAC 第 3 段">
              <span class="mac-sep">:</span>
              <input class="mac-part" inputmode="text" autocomplete="off" maxlength="2" placeholder="DD" data-mac-aria-index="4" aria-label="MAC 第 4 段">
              <span class="mac-sep">:</span>
              <input class="mac-part" inputmode="text" autocomplete="off" maxlength="2" placeholder="EE" data-mac-aria-index="5" aria-label="MAC 第 5 段">
              <span class="mac-sep">:</span>
              <input class="mac-part" inputmode="text" autocomplete="off" maxlength="2" placeholder="FF" data-mac-aria-index="6" aria-label="MAC 第 6 段">
            </div>
          </label>
          <div class="form-row">
            <label><span data-i18n="form.broadcast">广播地址</span>
              <input id="broadcast" autocomplete="off" placeholder="255.255.255.255">
            </label>
            <label><span data-i18n="form.port">端口</span>
              <input id="port" type="number" min="1" max="65535" placeholder="9">
            </label>
          </div>
          <label><span data-i18n="form.notes">备注</span>
            <textarea id="notes" data-i18n-placeholder="placeholder.notes" placeholder="可选"></textarea>
          </label>
          <div class="form-actions">
            <button class="primary" type="submit" data-i18n="button.save">保存</button>
            <button type="button" id="resetForm" data-i18n="button.clear">清空</button>
          </div>
        </form>
      </aside>
    </section>
  </main>

  <script>
    const els = {
      devices: document.getElementById('devices'),
      status: document.getElementById('status'),
      form: document.getElementById('deviceForm'),
      formTitle: document.getElementById('formTitle'),
      uiMode: document.getElementById('uiMode'),
      jsonMode: document.getElementById('jsonMode'),
      uiView: document.getElementById('uiView'),
      jsonView: document.getElementById('jsonView'),
      jsonEditor: document.getElementById('jsonEditor'),
      saveJson: document.getElementById('saveJson'),
      formatJson: document.getElementById('formatJson'),
      reloadJson: document.getElementById('reloadJson'),
      importJson: document.getElementById('importJson'),
      exportJson: document.getElementById('exportJson'),
      jsonFile: document.getElementById('jsonFile'),
      id: document.getElementById('id'),
      name: document.getElementById('name'),
      macParts: Array.from(document.querySelectorAll('.mac-part')),
      broadcast: document.getElementById('broadcast'),
      port: document.getElementById('port'),
      notes: document.getElementById('notes'),
      reset: document.getElementById('resetForm'),
      newDevice: document.getElementById('newDevice')
    };
    let devices = [];
    let mode = 'ui';
    let lang = 'en';
    let loaded = false;
    let synoToken = '';

    const messages = window.WOL_I18N || {};

    const errorMap = {
      'invalid JSON': 'error.invalidJson',
      'method not allowed': 'error.method',
      'device not found': 'error.deviceNotFound',
      'name is required': 'error.nameRequired',
      'port must be between 1 and 65535': 'error.portRange',
      'MAC address must look like AA:BB:CC:DD:EE:FF': 'error.mac'
    };

    function t(key, vars = {}) {
      const fallback = messages.en || {};
      const template = (messages[lang] && messages[lang][key]) || fallback[key] || key;
      return template.replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? '');
    }

    function localizeError(message) {
      if (!message) return t('error.request');
      const match = Object.keys(errorMap).find(token => message.includes(token));
      return match ? t(errorMap[match]) : message;
    }

    function normalizeLang(value) {
      const candidate = String(value || '').toLowerCase().replace('_', '-').trim();
      if (!candidate) return '';
      if (candidate === 'chs' || candidate === 'zh-cn' || candidate.startsWith('zh-hans')) return 'zh-CN';
      if (candidate === 'cht' || candidate === 'zh-tw' || candidate === 'zh-hk' || candidate === 'zh-mo' || candidate.startsWith('zh-hant')) return 'zh-TW';
      if (candidate === 'enu' || candidate.startsWith('en')) return 'en';
      if (candidate === 'fre' || candidate === 'fra' || candidate.startsWith('fr')) return 'fr';
      if (candidate === 'jpn' || candidate === 'jp' || candidate.startsWith('ja')) return 'ja';
      if (candidate === 'kor' || candidate === 'krn' || candidate === 'kr' || candidate === 'korean' || candidate.startsWith('ko')) return 'ko';
      return '';
    }

    function readDsmSession(root) {
      try {
        return root && root.SYNO && root.SYNO.SDS && root.SYNO.SDS.Session;
      } catch (_) {
        return null;
      }
    }

    function preferredDsmLang() {
      const params = new URLSearchParams(window.location.search);
      const rawFromParam = params.get('dsm_lang');
      if (String(rawFromParam || '').trim()) {
        window.WOL_LANG_DEBUG = {source: 'query', raw: rawFromParam, normalized: normalizeLang(rawFromParam) || 'en'};
        return normalizeLang(rawFromParam) || 'en';
      }
      const roots = [window];
      try { if (window.parent && window.parent !== window) roots.push(window.parent); } catch (_) {}
      try { if (window.top && window.top !== window) roots.push(window.top); } catch (_) {}
      try { if (window.opener) roots.push(window.opener); } catch (_) {}
      for (const root of roots) {
        const session = readDsmSession(root);
        const raw = session && (session.lang || session.sys_lang);
        if (String(raw || '').trim()) {
          window.WOL_LANG_DEBUG = {source: 'dsm-session', raw, normalized: normalizeLang(raw) || 'en'};
          return normalizeLang(raw) || 'en';
        }
      }
      window.WOL_LANG_DEBUG = {source: 'browser', raw: navigator.language, normalized: ''};
      return '';
    }

    function preferredLang() {
      const dsmLang = preferredDsmLang();
      if (dsmLang) {
        const selected = messages[dsmLang] ? dsmLang : 'en';
        window.WOL_LANG_DEBUG.selected = selected;
        window.WOL_LANG_DEBUG.hasSelectedMessages = Boolean(messages[selected]);
        return selected;
      }
      const browserLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
      for (const candidate of browserLangs) {
        const lang = normalizeLang(candidate);
        if (lang && messages[lang]) {
          window.WOL_LANG_DEBUG.selected = lang;
          window.WOL_LANG_DEBUG.hasSelectedMessages = true;
          return lang;
        }
      }
      window.WOL_LANG_DEBUG.selected = 'en';
      window.WOL_LANG_DEBUG.hasSelectedMessages = Boolean(messages.en);
      return 'en';
    }

    function applyI18n() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-aria-label]').forEach(el => {
        el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel));
      });
      els.macParts.forEach(input => {
        input.setAttribute('aria-label', t('mac.aria', {index: input.dataset.macAriaIndex}));
      });
      els.formTitle.textContent = els.id.value ? t('form.editTitle') : t('form.addTitle');
      render();
      if (loaded) {
        setStatus(t('status.devices', {count: devices.length}), 'ok');
      } else {
        setStatus(t('status.loading'));
      }
      document.documentElement.classList.remove('i18n-pending');
      document.documentElement.classList.add('i18n-ready');
    }

    async function api(action, payload) {
      if (!synoToken) throw new Error('unauthorized');
      const init = payload ? {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      } : {};
      init.headers = {...(init.headers || {}), 'X-SYNO-TOKEN': synoToken};
      const res = await fetch(`index.cgi?action=${action}`, init);
      const data = await res.json();
      if (!res.ok) throw new Error(localizeError(data.error));
      return data;
    }

    async function getDsmSynoToken() {
      const res = await fetch('/webapi/entry.cgi?api=SYNO.API.Auth&version=6&method=token', {
        cache: 'no-store',
        credentials: 'same-origin'
      });
      const data = await res.json();
      const token = data && data.data && data.data.synotoken;
      if (!res.ok || !data.success || !token) throw new Error('unauthorized');
      return token;
    }

    function setStatus(text, kind = '') {
      els.status.textContent = text;
      els.status.className = `status ${kind}`;
    }

    function cleanMac(value) {
      return (value || '').replace(/[^0-9a-fA-F]/g, '').toUpperCase().slice(0, 12);
    }

    function setMac(value) {
      const compact = cleanMac(value);
      els.macParts.forEach((input, index) => {
        input.value = compact.slice(index * 2, index * 2 + 2);
      });
    }

    function getMac() {
      return els.macParts.map(input => input.value).join(':').toUpperCase();
    }

    function focusMacPart(index) {
      const input = els.macParts[Math.max(0, Math.min(index, els.macParts.length - 1))];
      input.focus();
      input.select();
    }

    function setupMacInput() {
      els.macParts.forEach((input, index) => {
        input.addEventListener('input', () => {
          const compact = cleanMac(input.value);
          input.value = compact.slice(0, 2);
          if (compact.length > 2) {
            const full = els.macParts.map(part => part.value).join('').slice(0, index * 2) + compact;
            setMac(full);
          }
          if (input.value.length === 2 && index < els.macParts.length - 1) {
            focusMacPart(index + 1);
          }
        });
        input.addEventListener('keydown', event => {
          if (event.key === 'Backspace' && input.selectionStart === 0 && input.selectionEnd === 0 && index > 0) {
            event.preventDefault();
            els.macParts[index - 1].value = '';
            focusMacPart(index - 1);
          }
          if (event.key === 'ArrowLeft' && input.selectionStart === 0 && index > 0) {
            event.preventDefault();
            focusMacPart(index - 1);
          }
          if (event.key === 'ArrowRight' && input.selectionStart === input.value.length && index < els.macParts.length - 1) {
            event.preventDefault();
            focusMacPart(index + 1);
          }
        });
        input.addEventListener('paste', event => {
          event.preventDefault();
          const text = event.clipboardData.getData('text');
          setMac(text);
          const nextIndex = Math.min(Math.ceil(cleanMac(text).length / 2), els.macParts.length - 1);
          focusMacPart(nextIndex);
        });
      });
    }

    function render() {
      els.devices.innerHTML = '';
      if (devices.length === 0) {
        els.devices.innerHTML = `<div class="empty">${t('empty.devices')}</div>`;
        return;
      }
      for (const device of devices) {
        const item = document.createElement('div');
        item.className = 'device';
        item.innerHTML = `
          <div>
            <div class="name"></div>
            <div class="meta"></div>
          </div>
          <div class="actions">
            <button class="primary" data-action="wake"></button>
            <button data-action="edit"></button>
            <button class="danger" data-action="delete"></button>
          </div>`;
        item.querySelector('.name').textContent = device.name;
        item.querySelector('.meta').textContent = `${device.mac} | ${device.broadcast}:${device.port}`;
        item.querySelector('[data-action="wake"]').textContent = t('button.wake');
        item.querySelector('[data-action="edit"]').textContent = t('button.edit');
        item.querySelector('[data-action="delete"]').textContent = t('button.delete');
        item.querySelector('[data-action="wake"]').onclick = () => wake(device);
        item.querySelector('[data-action="edit"]').onclick = () => edit(device);
        item.querySelector('[data-action="delete"]').onclick = () => remove(device);
        els.devices.appendChild(item);
      }
      syncJsonEditor();
    }

    function devicesJson() {
      return JSON.stringify(devices, null, 2);
    }

    function syncJsonEditor() {
      if (document.activeElement !== els.jsonEditor) {
        els.jsonEditor.value = devicesJson();
      }
    }

    function parseJsonDevices(text) {
      const parsed = JSON.parse(text);
      const list = Array.isArray(parsed) ? parsed : parsed.devices;
      if (!Array.isArray(list)) {
        throw new Error(t('error.jsonShape'));
      }
      return list;
    }

    function formatJsonEditor() {
      const list = parseJsonDevices(els.jsonEditor.value);
      els.jsonEditor.value = JSON.stringify(list, null, 2);
      return list;
    }

    function setMode(nextMode) {
      mode = nextMode;
      els.uiMode.classList.toggle('active', mode === 'ui');
      els.jsonMode.classList.toggle('active', mode === 'json');
      els.uiView.hidden = mode !== 'ui';
      els.jsonView.hidden = mode !== 'json';
      els.jsonView.classList.toggle('active', mode === 'json');
      if (mode === 'json') {
        els.jsonEditor.value = devicesJson();
        els.jsonEditor.focus();
      }
    }

    async function load() {
      try {
        synoToken = await getDsmSynoToken();
        const data = await api('list');
        devices = data.devices || [];
        loaded = true;
        render();
        syncJsonEditor();
        setStatus(t('status.devices', {count: devices.length}), 'ok');
      } catch (err) {
        setStatus(err.message, 'err');
      }
    }

    function edit(device) {
      els.formTitle.textContent = t('form.editTitle');
      els.id.value = device.id;
      els.name.value = device.name;
      setMac(device.mac);
      els.broadcast.value = device.broadcast;
      els.port.value = device.port;
      els.notes.value = device.notes || '';
      els.name.focus();
    }

    function clearForm() {
      els.formTitle.textContent = t('form.addTitle');
      els.form.reset();
      els.id.value = '';
      setMac('');
      els.broadcast.value = '255.255.255.255';
      els.port.value = '9';
      els.name.focus();
    }

    async function wake(device) {
      setStatus(t('status.waking', {name: device.name}));
      try {
        await api('wake', {id: device.id});
        setStatus(t('status.wakeSent', {name: device.name}), 'ok');
      } catch (err) {
        setStatus(err.message, 'err');
      }
    }

    async function remove(device) {
      if (!confirm(t('confirm.delete', {name: device.name}))) return;
      try {
        await api('delete', {id: device.id});
        await load();
      } catch (err) {
        setStatus(err.message, 'err');
      }
    }

    els.form.onsubmit = async (event) => {
      event.preventDefault();
      const device = {
        id: els.id.value,
        name: els.name.value,
        mac: getMac(),
        broadcast: els.broadcast.value || '255.255.255.255',
        port: Number(els.port.value || 9),
        notes: els.notes.value
      };
      try {
        await api('save', device);
        clearForm();
        await load();
      } catch (err) {
        setStatus(err.message, 'err');
      }
    };

    els.uiMode.onclick = () => setMode('ui');
    els.jsonMode.onclick = () => setMode('json');
    els.formatJson.onclick = () => {
      try {
        const list = formatJsonEditor();
        setStatus(t('status.jsonFormatted', {count: list.length}), 'ok');
      } catch (err) {
        setStatus(err.message, 'err');
      }
    };
    els.reloadJson.onclick = () => {
      els.jsonEditor.value = devicesJson();
      setStatus(t('status.reloaded'), 'ok');
    };
    els.saveJson.onclick = async () => {
      let list;
      try {
        list = formatJsonEditor();
      } catch (err) {
        setStatus(err.message, 'err');
        return;
      }
      if (!confirm(t('confirm.saveJson', {count: devices.length}))) return;
      try {
        const data = await api('replace', {devices: list});
        devices = data.devices || [];
        render();
        els.jsonEditor.value = devicesJson();
        setStatus(t('status.savedJson', {count: devices.length}), 'ok');
      } catch (err) {
        setStatus(err.message, 'err');
      }
    };
    els.exportJson.onclick = () => {
      const blob = new Blob([devicesJson() + '\n'], {type: 'application/json;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'wolmanager-devices.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus(t('status.exported'), 'ok');
    };
    els.importJson.onclick = () => {
      els.jsonFile.value = '';
      els.jsonFile.click();
    };
    els.jsonFile.onchange = async () => {
      const file = els.jsonFile.files && els.jsonFile.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const list = parseJsonDevices(text);
        if (!confirm(t('confirm.importJson', {current: devices.length, incoming: list.length}))) return;
        const data = await api('replace', {devices: list});
        devices = data.devices || [];
        render();
        setMode('json');
        els.jsonEditor.value = devicesJson();
        setStatus(t('status.imported', {count: devices.length}), 'ok');
      } catch (err) {
        setStatus(err.message, 'err');
      }
    };
    els.reset.onclick = clearForm;
    els.newDevice.onclick = clearForm;
    lang = preferredLang();
    setupMacInput();
    applyI18n();
    clearForm();
    load();
  </script>
</body>
</html>
